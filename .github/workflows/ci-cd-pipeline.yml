name: EduProcess CI/CD Multi-Environment Pipeline

on:
  push:
    branches: [develop, qa, main]
  pull_request:
    branches: [develop, qa, main]

jobs:
  verify-frontend:
    name: Frontend & Mobile (Capacitor) Verification (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Monorepo Code
        uses: actions/checkout@v4

      - name: Check Frontend/Mobile Changes
        id: filter-frontend
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend_files:
              - 'frontend/**'
              - '.github/workflows/ci-cd-pipeline.yml'

      - name: Setup Node.js v24 Environment
        if: steps.filter-frontend.outputs.frontend_files == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Setup Java 21 (Required for Capacitor Build)
        if: steps.filter-frontend.outputs.frontend_files == 'true' && (github.base_ref == 'qa' || github.ref == 'refs/heads/qa' || github.base_ref == 'main' || github.ref == 'refs/heads/main')
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Execute Install Checks (Dependencies)
        if: steps.filter-frontend.outputs.frontend_files == 'true'
        run: npm install --no-audit --no-fund

      - name: Execute Build Verification (Vite Compilation)
        if: steps.filter-frontend.outputs.frontend_files == 'true'
        env:
          # Inyección dinámica de URL según el entorno de destino
          VITE_API_URL: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && 'https://eduprocessprod.programacionwebuce.net' || 'https://eduprocessqa.programacionwebuce.net' }}
        run: npm run build

      - name: Synchronize Capacitor Android Project
        if: steps.filter-frontend.outputs.frontend_files == 'true' && (github.base_ref == 'qa' || github.ref == 'refs/heads/qa' || github.base_ref == 'main' || github.ref == 'refs/heads/main')
        run: npx cap sync android

      - name: Assemble Mobile APK Build via Gradle
        if: steps.filter-frontend.outputs.frontend_files == 'true' && (github.base_ref == 'qa' || github.ref == 'refs/heads/qa' || github.base_ref == 'main' || github.ref == 'refs/heads/main')
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Mobile APK Artifact to GitHub
        if: steps.filter-frontend.outputs.frontend_files == 'true' && (github.base_ref == 'qa' || github.ref == 'refs/heads/qa' || github.base_ref == 'main' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && 'eduprocess-mobile-prod-build' || 'eduprocess-mobile-qa-build' }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  verify-backend:
    name: Backend Verification (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Monorepo Code
        uses: actions/checkout@v4

      - name: Check Backend Changes
        id: filter-backend
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend_files:
              - 'backend/**'
              - '.github/workflows/ci-cd-pipeline.yml'

      - name: Setup Node.js v22 LTS Environment
        if: steps.filter-backend.outputs.backend_files == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "./backend/package-lock.json"

      - name: Execute Install Checks (Dependencies)
        if: steps.filter-backend.outputs.backend_files == 'true'
        run: npm install --no-audit --no-fund

      - name: Execute Prisma Client Generation
        if: steps.filter-backend.outputs.backend_files == 'true'
        run: npx prisma generate

      - name: Execute Build Verification (Compilation)
        if: steps.filter-backend.outputs.backend_files == 'true'
        run: npm run build

      - name: Execute All Test Suites (Auth & Procedures)
        if: steps.filter-backend.outputs.backend_files == 'true'
        run: npm test

  verify-desktop:
    name: Desktop (Electron) Verification & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./desktop
    steps:
      - name: Checkout Monorepo Code
        uses: actions/checkout@v4

      - name: Check Desktop Changes
        id: filter-desktop
        uses: dorny/paths-filter@v3
        with:
          filters: |
            desktop_files:
              - 'desktop/**'
              - '.github/workflows/ci-cd-pipeline.yml'

      - name: Setup Node.js v22 Environment
        if: steps.filter-desktop.outputs.desktop_files == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "./desktop/package-lock.json"

      - name: Execute Install Checks (Dependencies)
        if: steps.filter-desktop.outputs.desktop_files == 'true'
        run: npm install --no-audit --no-fund

      - name: Create Dynamic .env File for Electron
        if: steps.filter-desktop.outputs.desktop_files == 'true'
        run: |
          if [ "${{ github.base_ref }}" = "main" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "NODE_ENV=production" >> .env
            echo "APP_URL=https://eduprocessprod.programacionwebuce.net" >> .env
          else
            echo "NODE_ENV=production" >> .env
            echo "APP_URL=https://eduprocessqa.programacionwebuce.net" >> .env
          fi

      - name: Install Wine
        if: steps.filter-desktop.outputs.desktop_files == 'true'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo apt-get install -y \
            wine64 \
            wine32 \
            wine64-tools

          # Algunos runners no crean el binario wine
          if [ ! -f /usr/bin/wine ]; then
            sudo ln -s /usr/bin/wine64 /usr/bin/wine
          fi

          which wine
          wine --version

      - name: Verify Wine installation
        if: steps.filter-desktop.outputs.desktop_files == 'true'
        run: |
          which wine || true
          which wine64 || true

          ls -l /usr/bin/wine*

      - name: Build Desktop Executable (Linux & Windows Cross-Compile)
        if: steps.filter-desktop.outputs.desktop_files == 'true'
        run: npm run build -- --linux --win

      - name: Upload Desktop Artifacts to GitHub
        if: steps.filter-desktop.outputs.desktop_files == 'true' && (github.base_ref == 'qa' || github.ref == 'refs/heads/qa' || github.base_ref == 'main' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && 'eduprocess-desktop-prod-build' || 'eduprocess-desktop-qa-build' }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          retention-days: 7

  publish-images:
    name: Build & Publish Images to Docker Hub
    runs-on: ubuntu-latest
    needs: [verify-frontend, verify-backend, verify-desktop]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout Monorepo Code
        uses: actions/checkout@v4

      - name: Detect Changes for Docker
        id: docker-filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Target Image Tag
        id: get-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_tag=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/qa" ]; then
            echo "env_tag=qa" >> $GITHUB_OUTPUT
          else
            echo "env_tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Backend Image
        if: steps.docker-filter.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/eduprocess-backend:${{ steps.get-tag.outputs.env_tag }}

      - name: Build and Push Frontend Image
        if: steps.docker-filter.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/eduprocess-frontend:${{ steps.get-tag.outputs.env_tag }}

  deploy-qa:
    name: Deploy to AWS EC2 QA Environment
    runs-on: ubuntu-latest
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
    steps:
      - name: Checkout Monorepo Code
        uses: actions/checkout@v4

      - name: Copy Infrastructure Files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.QA_SSH_KEY }}
          source: "infrastructure/docker-compose.qa.yml,infrastructure/nginx.qa.conf,infrastructure/prometheus.qa.yml,infrastructure/alert.rules.yml,infrastructure/grafana-datasources.yml,infrastructure/grafana-dashboards.yml,infrastructure/dashboards/eduprocess_metrics.json"
          target: "~/eduprocess-qa"
          strip_components: 1

      - name: Execute Remote SSH Commands for Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.QA_SSH_KEY }}
          script: |
            cd ~/eduprocess-qa
            mv docker-compose.qa.yml docker-compose.yml 2>/dev/null || true
            mv nginx.qa.conf nginx.conf 2>/dev/null || true
            mv prometheus.qa.yml prometheus.yml 2>/dev/null || true
            sudo systemctl stop nginx 2>/dev/null || true
            sudo systemctl disable nginx 2>/dev/null || true
            docker compose pull
            docker compose up -d --remove-orphans --force-recreate
            docker image prune -f

  deploy-prod:
    name: Deploy to AWS EC2 Production Environment
    runs-on: ubuntu-latest
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Monorepo Code
        uses: actions/checkout@v4

      - name: Copy Infrastructure Files to Production via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "infrastructure/docker-compose.prod.yml,infrastructure/nginx.prod.conf,infrastructure/prometheus.prod.yml,infrastructure/alert.rules.yml,infrastructure/grafana-datasources.yml,infrastructure/grafana-dashboards.yml,infrastructure/dashboards/eduprocess_metrics.json"
          target: "~/eduprocess-prod"
          strip_components: 1

      - name: Execute Remote SSH Commands for Production Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ~/eduprocess-prod
            mv docker-compose.prod.yml docker-compose.yml 2>/dev/null || true
            mv nginx.prod.conf nginx.conf 2>/dev/null || true
            mv prometheus.prod.yml prometheus.yml 2>/dev/null || true
            sudo systemctl stop nginx 2>/dev/null || true
            sudo systemctl disable nginx 2>/dev/null || true
            docker compose pull
            docker compose up -d --remove-orphans --force-recreate
            docker image prune -f

  orchestrate-release:
    name: Automated Release Governance & Archival
    runs-on: ubuntu-latest
    needs: deploy-prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Monorepo Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Release Orchestration Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          chmod +x ./infrastructure/scripts/orchestrate-release.sh
          ./infrastructure/scripts/orchestrate-release.sh
